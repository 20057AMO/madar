name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod-tls.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.socket-proxy.yml config -q

      - name: Check shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private/organization installs that require a Gitleaks license must
          # add this repository secret; a failed scan is never suppressed.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  integration:
    name: Typecheck + build + full backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Generate ephemeral JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Point workspace binds at the checkout
        run: echo "WSD_WORKSPACES_HOST_DIR=${{ github.workspace }}/workspaces" >> "$GITHUB_ENV"

      # The compose default is production (0); the suite container needs the
      # relaxed budgets so multi-suite teardown never trips the rate limiters.
      - name: Enable relaxed rate budgets for the test suite
        run: echo "WSD_TESTING=1" >> "$GITHUB_ENV"

      - name: Build and launch the stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "app healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy in time"
          docker compose logs app | tail -100
          exit 1

      - name: Run full backend test suite
        working-directory: backend
        run: npm test

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs app | tail -200
