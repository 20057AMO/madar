name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Typecheck + build + full backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Generate ephemeral JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Point workspace binds at the checkout
        run: echo "WSD_WORKSPACES_HOST_DIR=${{ github.workspace }}/workspaces" >> "$GITHUB_ENV"

      # The compose default is production (0); the suite container needs the
      # relaxed budgets so multi-suite teardown never trips the rate limiters.
      - name: Enable relaxed rate budgets for the test suite
        run: echo "WSD_TESTING=1" >> "$GITHUB_ENV"

      - name: Build and launch the stack
        run: docker compose up -d --build

      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health >/dev/null 2>&1; then
              echo "app healthy after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy in time"
          docker compose logs app | tail -100
          exit 1

      - name: Run full backend test suite
        working-directory: backend
        run: |
          mapfile -t test_files < <(find tests -name '*.test.ts' -print | sort)
          for test_file in "${test_files[@]}"; do
            echo "::group::${test_file}"
            node --test --test-concurrency=1 "$test_file"
            echo "::endgroup::"
          done

      - name: Dump app logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color app | tail -300

      - name: Upload container diagnostics
        if: always()
        run: |
          mkdir -p ci-artifacts
          docker compose ps > ci-artifacts/compose-ps.txt
          docker compose logs --no-color app > ci-artifacts/app.log 2>&1 || true

      - name: Publish container diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-diagnostics
          path: ci-artifacts
          if-no-files-found: ignore

      - name: Stop stack
        if: always()
        run: docker compose down --volumes --remove-orphans
