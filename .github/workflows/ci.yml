name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.prod-tls.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.socket-proxy.yml config -q

      - name: Check shell syntax
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Private/organization installs that require a Gitleaks license must
          # add this repository secret; a failed scan is never suppressed.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  integration:
    name: Typecheck + build + isolated backend suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # npm test uses the isolated harness: it owns its server on an OS-assigned
      # loopback port and cleans up. Docker suites are opt-in, so skips are expected.
      - name: Run isolated backend test suite
        working-directory: backend
        run: npm test
