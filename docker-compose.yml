services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wsd-pro
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      WSD_PROJECTS_DIR: /workspaces
      # OPTIONAL host-side absolute path of ./workspaces, used as the bind source
      # when launching project containers so their /workspace sees the same files
      # (bind sources resolve on the Docker Desktop VM, not inside this container).
      # EMPTY ON PURPOSE: the default is a runtime derivation from
      # /proc/self/mountinfo, which cannot go stale when the checkout moves. Set
      # this ONLY for paths mountinfo cannot express (UNC share, WSL distro).
      WSD_WORKSPACES_HOST_DIR: "${WSD_WORKSPACES_HOST_DIR:-}"
      WSD_WORKSPACE_IMAGE: wsd/workspace:latest
      WSD_IDE_PORT: ${WSD_IDE_PORT:-8100}
      # In-container bind of code-server + opencode web. LOOPBACK ONLY: both
      # are unauthenticated root code-execution surfaces holding the docker
      # socket, and a 127.0.0.1 listener has no address on any docker network
      # — not the app network, not the default bridge a project container
      # sits on. Do not widen: a 0.0.0.0 bind is exactly the hole this closes.
      WSD_IDE_BIND: ${WSD_IDE_BIND:-127.0.0.1}
      WSD_OPENCODE_BIND: ${WSD_OPENCODE_BIND:-127.0.0.1}
      # The embedded-surface proxy: the ONLY route to code-server/opencode.
      # Requires an editor+ Madar session (HttpOnly cookie), proxies HTTP and
      # websockets, and forwards to the loopback upstreams above.
      WSD_EMBED_PROXY_PORT: ${WSD_EMBED_PROXY_PORT:-4097}
      # Interface the AUTHENTICATED proxy is published on. It now mirrors the
      # dashboard's own exposure: teammates reach Madar on 3000 from the LAN,
      # so the IDE/opencode proxy is reachable there too — behind a session
      # check, not open. Narrow to 127.0.0.1 to keep them host-local only.
      WSD_EMBEDDED_PUBLISH_HOST: ${WSD_EMBEDDED_PUBLISH_HOST:-0.0.0.0}
      WSD_CHAT_MODEL: ${WSD_CHAT_MODEL:-qwen3:30b}
      WSD_DATA_DIR: /app/data
      # JWT signing secret — set JWT_SECRET in .env (see .env.example) or tokens
      # are signed with this publicly known fallback (dev only!).
      JWT_SECRET: ${JWT_SECRET:-wsd-pro-insecure-default}
      OLLAMA_HOST: https://ollama.com
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      WSD_OPENCODE_PORT: ${WSD_OPENCODE_PORT:-4096}
      WSD_TESTING: ${WSD_TESTING:-0}
      # Off by default: opts into the CLI fallback for agent delegation
      # (attached to the named-agent session; only fires when a safe target
      # exists — never a base-agent `--session new` run).
      WSD_DELEGATE_CLI_FALLBACK: ${WSD_DELEGATE_CLI_FALLBACK:-0}
      WSD_ENCRYPTION_KEY: ${WSD_ENCRYPTION_KEY:-}
      WSD_TRUST_PROXY: ${WSD_TRUST_PROXY:-}
      # Crash-detector sweep cadence (min 5s; lower = faster detection, more
      # docker inspect calls per second).
      WSD_ALERT_SWEEP_MS: ${WSD_ALERT_SWEEP_MS:-10000}
      # Component-update machinery (code-server + opencode): optional base-URL
      # mirrors for GitHub/npm plus the download-size and boot-verify ceilings.
      # Empty bases = official endpoints; defaults are size 400MB / timeout 90s.
      WSD_UPDATE_GITHUB_BASE: ${WSD_UPDATE_GITHUB_BASE:-}
      WSD_UPDATE_DOWNLOAD_BASE: ${WSD_UPDATE_DOWNLOAD_BASE:-}
      WSD_UPDATE_NPM_REGISTRY: ${WSD_UPDATE_NPM_REGISTRY:-}
      WSD_UPDATES_MAX_BYTES: ${WSD_UPDATES_MAX_BYTES:-419430400}
      WSD_UPDATE_BOOT_TIMEOUT_MS: ${WSD_UPDATE_BOOT_TIMEOUT_MS:-90000}
      # Empty defaults on purpose: rateCeil treats a blank value as unset and falls
      # through to the WSD_TESTING-aware budgets (prod: check 6 / apply 2 per min;
      # WSD_TESTING=1: check 60 / apply 20). A positive .env value still wins.
      WSD_RATE_UPDATE_CHECK_MAX: ${WSD_RATE_UPDATE_CHECK_MAX:-}
      WSD_RATE_UPDATE_APPLY_MAX: ${WSD_RATE_UPDATE_APPLY_MAX:-}
      # Boot-time update re-apply: npm installs (opencode update) must write
      # their cache into the PERSISTENT data volume — the default /root/.npm
      # lives in the container's writable layer and dies with a rebuild.
      npm_config_cache: /app/data/.npm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./workspaces:/workspaces
      - wsd-data:/app/data
      - code-server-config:/root/.config/code-server
      - code-server-data:/root/.local/share/code-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Dashboard stays published on every interface: it is the authenticated
      # surface, and the only published route to the embedded surfaces is the
      # proxy beside it.
      - "3000:3000"
      # Embedded surfaces: ONLY the authenticated Madar proxy is published. The
      # raw 8100 (code-server) and 4096 (opencode) publishes are REMOVED — they
      # served unauthenticated root code execution to every container on the
      # docker bridge. Those upstreams are now loopback-bound in-container and
      # reachable only through here.
      - "${WSD_EMBEDDED_PUBLISH_HOST:-0.0.0.0}:${WSD_EMBED_PROXY_PORT:-4097}:${WSD_EMBED_PROXY_PORT:-4097}"
    depends_on:
      - workspace

  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    image: wsd/workspace:latest
    container_name: wsd-workspace
    restart: unless-stopped
    command: [ "sleep", "infinity" ]

volumes:
  wsd-data:
  code-server-config:
  code-server-data:
