map $http_upgrade $madar_connection_upgrade {
    default upgrade;
    ''      close;
}

log_format madar_safe '$remote_addr - [$time_local] "$uri" $status $body_bytes_sent rt=$request_time';

server {
    listen 80;
    server_name madar.example.com;
    access_log /var/log/nginx/madar-access.log madar_safe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$uri;
    }
}

server {
    listen 443 ssl;
    server_name madar.example.com;

    ssl_certificate /etc/letsencrypt/live/madar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madar.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/madar-access.log madar_safe;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $madar_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 4097 ssl;
    server_name madar.example.com;

    ssl_certificate /etc/letsencrypt/live/madar.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/madar.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/madar-access.log madar_safe;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors https://madar.example.com;" always;

    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:4097;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $madar_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
