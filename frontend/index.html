<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Madar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Fonts load asynchronously so an offline/LAN deployment never stalls
         first paint on the only third-party CDN in the product; the CSS
         falls back to system fonts until (or unless) they arrive. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"></noscript>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- App-shell service worker: repeat boots of the SPA shell (including
         the /#/ide and /#/opencode deep links) are answered from the network
         with the cached shell kept only as the offline fallback, so a boot
         right after a rebuild can never start from a pre-rebuild shell.
         API/WebSocket traffic is bypassed entirely by the worker. Registered
         post-load so it can never contend with the first paint; failures are
         silently ignored (private mode, file://, older browsers).

         The same script carries the stale-chunk self-heal. It has to live here,
         in the inline classic script: this is the only code that runs even when
         the entry chunk or the cached shell itself is from a previous build.
         Vite's preload helper dispatches a cancelable vite:preloadError with
         the original error as `payload` and re-throws unless preventDefault()
         ran — so swallowing it and reloading is enough.

         The sessionStorage guard (key + logic mirrored in
         src/lib/chunk-reload.ts) holds `<entry chunk>|<failure>`: while ANY
         guard is present this shell has already spent its one automatic
         reload, which is what makes a reload loop impossible — a genuinely
         newer shell gets a fresh attempt because the boot hook in main.tsx
         drops a guard written by a different shell. When the guard refuses we
         do nothing at all, so the error travels on to the error boundary and
         the user gets honest copy. Without a persistable guard (private mode)
         we never reload either.

         Typed-but-unsent input makes the reload lossy (a chat draft, a
         half-typed prompt, a provider key), so it is only ever taken when
         nothing is at stake: otherwise the guard is claimed and spent, the
         reload is withheld, and the rejection travels on to the error
         boundary, which asks instead. The sibling `wsd.chunkReloadDeferred`
         flag is how the boundary tells "withheld" from "spent"; main.tsx
         clears it with the guard, so it never outlives its decision. -->
    <script>
      (function () {
        var KEY = 'wsd.chunkReload';
        var DEFERRED = 'wsd.chunkReloadDeferred';
        /* Toggles and selects are skipped — a chosen option is not work in
           progress. A false positive costs one click; a false negative costs
           the user's text. */
        function hasPendingInput() {
          var nodes = document.querySelectorAll('input, textarea, [contenteditable]');
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            if (el.disabled || el.readOnly) continue;
            var type = (el.type || '').toLowerCase();
            if (type === 'checkbox' || type === 'radio' || type === 'file' ||
                type === 'button' || type === 'submit' || type === 'reset' ||
                type === 'hidden') continue;
            if (el.value) return true;
            if (el.isContentEditable && el.textContent && el.textContent.trim()) return true;
          }
          return false;
        }
        window.addEventListener('vite:preloadError', function (e) {
          var entry = document.querySelector('script[type="module"][src]');
          var shell = (entry && entry.getAttribute('src')) || window.location.pathname;
          var failure = (e.payload && e.payload.message) || shell;
          try {
            if (window.sessionStorage.getItem(KEY)) return;
            window.sessionStorage.setItem(KEY, shell + '|' + failure);
          } catch (err) {
            return;
          }
          if (hasPendingInput()) {
            try { window.sessionStorage.setItem(DEFERRED, '1'); } catch (err) { }
            return;
          }
          e.preventDefault();
          window.location.reload();
        });
      })();
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
