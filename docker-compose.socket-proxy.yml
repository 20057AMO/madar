# Optional overlay: restrict the app's Docker API access through a filtered proxy.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.socket-proxy.yml up -d --build
#
# Trade-off: EXEC=1 is enabled because the project terminal needs docker exec.
# A bug in the app can still exec into containers it can reach; this overlay
# removes the direct root-equivalent host socket mount, but it is not a sandbox.
# POST=1 also permits state-changing Docker API calls (create/start/stop), so
# this is harm reduction, not least privilege. Pin the image by digest for
# production if you adopt this overlay.
services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: wsd-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      POST: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      INFO: "1"
      VERSION: "1"
      # Required by the project terminal (`docker exec`); see trade-off above.
      EXEC: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  app:
    depends_on: !override
      workspace:
        condition: service_started
      docker-proxy:
        condition: service_started
    environment:
      # docker-modem (used by dockerode) reads DOCKER_HOST automatically.
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes: !override
      # The direct /var/run/docker.sock mount is deliberately omitted.
      - ./workspaces:/workspaces
      - wsd-data:/app/data
      - code-server-config:/root/.config/code-server
      - code-server-data:/root/.local/share/code-server
      - ./Dockerfile.workspace:/opt/madar/build/Dockerfile.workspace:ro
